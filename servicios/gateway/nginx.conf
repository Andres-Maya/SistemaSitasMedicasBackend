# API Gateway + portal web.
# Enruta por prefijo hacia el servicio dueño de cada contexto. El frontend solo conoce /api/clinica.
server {
    listen 80;

    # DNS interno de Docker resuelto en cada petición: si un servicio está caído,
    # solo sus rutas devuelven 502 y el gateway sigue arrancando y atendiendo lo demás.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $agenda          http://agenda:8081;
    set $historia        http://historia-clinica:8082;
    set $notificaciones  http://notificaciones:8083;

    proxy_connect_timeout 3s;
    proxy_read_timeout    30s;

    # Contexto Agenda
    location ~ ^/api/clinica/(cita|medicos|especialidades|agenda)(/|$) {
        proxy_pass $agenda;
    }

    # Contexto Historia Clínica (incluye pacientes y autenticación)
    location ~ ^/api/clinica/(paciente|login|historia|historia-health|prescripcion|laboratorio|auditoria)(/|$) {
        proxy_pass $historia;
    }

    # Contexto Notificaciones (solo lectura, para la demostración)
    location /api/notificaciones {
        proxy_pass $notificaciones;
    }

    # Portal del paciente (React compilado)
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
